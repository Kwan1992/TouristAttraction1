<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <title th:text="${title} + ' · Turistguide'">Turistguide</title>
</head>
<body>
<header th:fragment="header(active)" class="site-header">
    <div class="container nav">
        <a class="brand" th:href="@{/}">TouristGuide</a>
        <nav class="nav-links" aria-label="Main navigation">
            <a th:href="@{/}" th:attr="aria-current=${active == 'home'} ? 'page'">Home</a>
            <a th:href="@{/copenhagen}" th:attr="aria-current=${active == 'copenhagen'} ? 'page'">Copenhagen</a>
            <a th:href="@{/attractions}" th:attr="aria-current=${active == 'attractions'} ? 'page'">Attractions</a>
        </nav>
    </div>
</header>

<footer th:fragment="footer" class="site-footer">
    <div class="container footer-inner">
        <span>&copy; 2026 Turistguide · Explore Denmark</span>
        <a href="mailto:hello@touristguide.example">hello@touristguide.example</a>
    </div>
</footer>
</body>
</html>
