<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment :: head('Attractions')}"></head>
<body>
<header th:replace="~{fragment :: header('attractions')}"></header>

<main class="container">
    <div class="page-head">
        <p class="eyebrow">Guide</p>
        <h1>Attractions</h1>
        <p class="lead">Pick a place to see what it is about and what it is good for.</p>
    </div>

    <label class="sr-only" for="q" style="position:absolute;left:-9999px">Search attractions</label>
    <input class="search" id="q" type="search" placeholder="Search by name, city or tag" autocomplete="off">

    <ul class="rows" id="rows">
        <li class="row" th:each="attraction : ${attractions}">
            <div>
                <h3 th:text="${attraction.name}">Name</h3>
                <span class="row-city" th:text="${attraction.city}">City</span>
            </div>
            <p th:text="${attraction.description}">Description</p>
            <div class="row-end">
                <ul class="chips">
                    <li class="chip" th:each="tag : ${attraction.tags}" th:text="${tag}">Tag</li>
                </ul>
                <a class="link" th:href="@{/attractions/{name}/tags(name=${attraction.name})}">Details →</a>
            </div>
        </li>
    </ul>
    <p class="empty" id="empty" hidden>No attractions match your search.</p>
</main>

<footer th:replace="~{fragment :: footer}"></footer>

<script>
    const q = document.getElementById('q'), rows = [...document.querySelectorAll('#rows .row')], empty = document.getElementById('empty');
    q.addEventListener('input', () => {
        const t = q.value.trim().toLowerCase();
        let n = 0;
        rows.forEach(r => { const show = r.textContent.toLowerCase().includes(t); r.hidden = !show; if (show) n++; });
        empty.hidden = n > 0;
    });
</script>
</body>
</html>
