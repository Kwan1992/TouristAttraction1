<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment :: head('Details')}"></head>
<body>
<header th:replace="~{fragment :: header('attractions')}"></header>

<main class="container">
    <a class="back" th:href="@{/attractions}">← All attractions</a>

    <div class="detail" th:if="${attraction != null}">
        <p class="eyebrow" th:text="${attraction.city}">City</p>
        <h1 th:text="${attraction.name}">Name</h1>
        <p class="lead" th:text="${attraction.description}">Description</p>
        <ul class="chips">
            <li class="chip" th:each="tag : ${attraction.tags}" th:text="${tag}">Tag</li>
        </ul>
    </div>

    <div class="detail" th:if="${attraction == null}">
        <h1>Not found</h1>
        <p class="lead">We could not find that attraction.</p>
    </div>
</main>

<footer th:replace="~{fragment :: footer}"></footer>
</body>
</html>
